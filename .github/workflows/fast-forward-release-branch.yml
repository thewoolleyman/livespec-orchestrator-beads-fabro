# fast-forward-release-branch.yml — keep the `release` branch pinned to the
# latest release.
#
# Substrate for fleet plugin ref-pinning (livespec core epic livespec-c1k9,
# design plan/fleet-plugin-currency/research/design.md). The fleet's
# marketplace registrations pin each plugin entry to the `release` branch ref,
# which must always resolve to the latest published release commit. On every
# published release this fast-forwards `refs/heads/release` to the release
# tag's commit.
#
# Event: `release: published` — the same event release-dispatch.yml rides, and
# the release is authored via the App token (release-please.yml) so the event
# reliably fires.
#
# Auth: mints the livespec GitHub App installation token (secrets APP_ID +
# APP_PRIVATE_KEY), mirroring release-please.yml — the App identity that
# authors the release also advances the branch.
#
# The push is fast-forward-only: a plain `git push` (no --force) is rejected by
# the remote when `release` is not an ancestor of the released commit, failing
# the job loudly instead of silently rewriting the branch.

name: Fast-forward release branch

on:
  release:
    types: [published]
  # OPERATOR DISPATCH (bd-ib-sghxlk; spec v327; livespec-dev-tooling v155 option D). The
  # job below runs ONLY on this dispatch, so a published release no longer
  # moves `release` by itself: every fleet clone's SessionStart ensure-plugins
  # installs whatever `release` names, so `release` advances only when an
  # operator dispatches a tag, which starts that release's canary:
  #   gh workflow run fast-forward-release-branch.yml -f tag=vX.Y.Z
  # The `release: published` trigger above still fires; its job is skipped.
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to advance `release` to (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fast-forward-release-branch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # On a dispatch the checkout above has no release payload, so it checks
      # out the dispatched ref; this step moves HEAD to the tag the operator
      # names. The push below stays fast-forward-only, so a tag that does not
      # descend from the current `release` fails the run and moves nothing.
      - name: Check out the dispatched tag
        env:
          ROLL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/tags/${ROLL_TAG}^{commit}" >/dev/null; then
            echo "roll tag ${ROLL_TAG} is not a tag of this repository" >&2
            exit 1
          fi
          git checkout --detach "refs/tags/${ROLL_TAG}"
          echo "Roll tag ${ROLL_TAG} = $(git rev-parse HEAD)"

      - name: Fast-forward the release branch to the released commit
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          echo "Release ${{ github.event.release.tag_name }} = ${release_sha}"
          # Fast-forward-only: no --force, so the remote rejects (and this job
          # fails loudly) if `release` has diverged from the released history.
          git push origin "HEAD:refs/heads/release"
