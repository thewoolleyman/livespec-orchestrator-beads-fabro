# The ROOT-uid half of bd-ib-sfa2's both-uids coverage invariant, run on master
# on a schedule instead of on every pull request.
#
# Authority: maintainer direction, verbatim, 2026-11-03 — "why is ci so sl ow
# and expensive . c9verage gates look like culprit. root and non root . is
# overkill. move one to dschrduled master job." — carried by bd-ib-xufdwx (plan
# ci-runtime-and-cost, epic livespec-dev-tooling-ib3oe3). The coordinator's
# ruling on that plan's 7-day measurement chose which uid moves: NONROOT stays
# on every pull request in ci.yml, because it is the production-shaped uid (the
# janitor and factory workers run non-root), and ROOT moves here. The root legs
# were 27% of all fleet k3s CI job-hours, and every root-only failure in the
# measured week was a flake that also failed nonroot in another run.
#
# WHAT IS RUN. The same six uid-doubled targets ci.yml runs as nonroot —
# check-lint, check-format, check-types, check-python-batch and the
# check-per-file-coverage -> check-coverage pair — as root, each still gated at
# fail_under = 100 on its own, so bd-ib-sfa2's divergence argument holds: a
# line reachable only as root fails the nonroot leg on the pull request, and a
# line reachable only as non-root fails THIS leg on master.
#
# WHEN. Every three hours and on workflow_dispatch. The decide job skips the
# whole run when master's head SHA equals the head of the last completed
# root-uid run that reached a verdict, so a quiet master costs nothing.
#
# WHAT RED MEANS. This workflow is NOT the master gate: ci.yml stays the one
# gating workflow master-health-reconcile reads, so a red root run never
# triggers a revert. A red run is turned into owned work by the host-side
# breakage filer (bd-ib-pgbr52), which files one ledger item naming the failing
# job and tests per failed run.

name: CI root uid (scheduled)

env:
  UV_HTTP_RETRIES: "5"
  MISE_HTTP_RETRIES: "5"
  # Lane-selected uv fetch bounds — the same form ci.yml carries, required of
  # every workflow that routes through CI_RUNNER_LABELS (self_hosted_uv_lane).
  UV_CONCURRENT_DOWNLOADS: ${{ contains(inputs.runner_labels || vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '50' || '4' }}
  UV_HTTP_TIMEOUT: ${{ contains(inputs.runner_labels || vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '30' || '60' }}

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      runner_labels:
        description: >-
          JSON runner-label array for every root job of this dispatch, for
          example ["livespec-orchestrator-k3s"]. Empty (the default) keeps
          CI_RUNNER_LABELS / CI_COVERAGE_RUNNER_LABELS, so a scheduled run and a
          plain dispatch route exactly as before.
        required: false
        default: ""
        type: string

concurrency:
  group: ci-root-uid
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # Hosted on purpose: deciding to skip must cost no churn slot.
  decide:
    name: decide (skip an unchanged master head)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Compare master's head with the last root-uid run's head
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "workflow_dispatch: always run"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A cancelled or still-running run reached no verdict, so only a run
          # that concluded success or failure counts as having checked a head.
          last="$(gh api "repos/${REPO}/actions/workflows/ci-root-uid.yml/runs?branch=master&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].head_sha // ""')"
          if [ "$last" = "$HEAD_SHA" ]; then
            echo "master head ${HEAD_SHA} was already checked by the last root-uid run; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "master head ${HEAD_SHA} differs from the last checked head '${last}'; running"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  check-python:
    name: ${{ matrix.target }} (${{ matrix.uid }})
    needs: [decide]
    if: needs.decide.outputs.run == 'true'
    runs-on: ${{ fromJSON(inputs.runner_labels || vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.186.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        # bd-ib-sfa2's both-uids argument is recorded at ci.yml's check-python
        # matrix; this file is its root half.
        uid:
          - root
        target:
          - check-lint
          - check-format
          - check-types
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # The baked container runs git as ROOT over a uid-1001 checkout, so every
      # post-checkout git call fails "detected dubious ownership" (exit 128)
      # without this. actions/checkout adds its own safe.directory but scopes it
      # to a temporary HOME it discards, and resolve_repo_root() (config.py)
      # strips all GIT_* env before shelling git — so an env-var GIT_CONFIG_*
      # approach is invisible to it. It MUST be the --global write to
      # $HOME/.gitconfig (HOME=/github/home) so EVERY git call reads it.
      # Tools are baked into the image; `mise install` is a near-no-op that just
      # confirms the pinned versions. A fresh container does not TRUST the repo
      # .mise.toml, so `mise trust` is required for the shims to resolve.
      # (Replaces the mise-action install + the actions/cache uv restore — the
      # container image is the cache now.)
      # bd-ib-hik3mz: ONE step, not three. Every step of a k3s job pays
      # about 1 s of container-hook launch; same commands, same order, and the
      # step shell is -e, so the first failing command still fails the step.
      - name: Prepare workspace (git trust, mise trust + install, uv sync)
        run: |
          git config --global --add safe.directory '*'
          mise trust
          mise install
          uv sync --all-groups

      # bd-ib-jcrdzk: a GitHub-hosted container's HOME is /github/home, so mise
      # cannot find its global config under /root and the node shim resolves no
      # version; pyright then falls back to nodeenv, which crashes. Point mise at
      # the baked config and put its shims first, as ci.yml's legs already do.
      - name: Point mise at the baked global config (root)
        if: matrix.uid == 'root'
        run: |
          echo "MISE_GLOBAL_CONFIG_FILE=/root/.config/mise/config.toml" >> "$GITHUB_ENV"
          echo "/root/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: just ${{ matrix.target }} (root)
        if: matrix.uid == 'root'
        run: just ${{ matrix.target }}

  check-per-file-coverage:
    name: check-per-file-coverage (${{ matrix.uid }})
    needs: [decide]
    if: needs.decide.outputs.run == 'true'
    # bd-ib-uxv5al: the coverage pair routes through its OWN variable so it can
    # stay on k3s while CI_RUNNER_LABELS sends every other job to hosted runners
    # (a hosted runner ran this suite at 55+ min against a 17.5 min k3s median).
    # Unset, it falls through to CI_RUNNER_LABELS, so nothing moves.
    runs-on: ${{ fromJSON(inputs.runner_labels || vars.CI_COVERAGE_RUNNER_LABELS || vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.186.0
    env:
      # Lane-selected uv bounds from THIS job's routing (see the top-level env).
      UV_CONCURRENT_DOWNLOADS: ${{ contains(inputs.runner_labels || vars.CI_COVERAGE_RUNNER_LABELS || vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '50' || '4' }}
      UV_HTTP_TIMEOUT: ${{ contains(inputs.runner_labels || vars.CI_COVERAGE_RUNNER_LABELS || vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '30' || '60' }}
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        uid:
          - root
    steps:
      # Per-step `if:` (not job-level) so the job still reports its own status
      # check name when skipped — same pattern as the check-python matrix.

      - name: Checkout
        uses: actions/checkout@v4

      # bd-ib-hik3mz: ONE step, not three. Every step of a k3s job pays
      # about 1 s of container-hook launch; same commands, same order, and the
      # step shell is -e, so the first failing command still fails the step.
      - name: Prepare workspace (git trust, mise trust + install, uv sync)
        run: |
          git config --global --add safe.directory '*'
          mise trust
          mise install
          uv sync --all-groups

      # bd-ib-jcrdzk: a GitHub-hosted container's HOME is /github/home, so mise
      # cannot find its global config under /root and the node shim resolves no
      # version; pyright then falls back to nodeenv, which crashes. Point mise at
      # the baked config and put its shims first, as ci.yml's legs already do.
      - name: Point mise at the baked global config (root)
        if: matrix.uid == 'root'
        run: |
          echo "MISE_GLOBAL_CONFIG_FILE=/root/.config/mise/config.toml" >> "$GITHUB_ENV"
          echo "/root/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: just check-per-file-coverage (root)
        if: matrix.uid == 'root'
        run: just check-per-file-coverage

      # include-hidden-files is REQUIRED: upload-artifact@v4 excludes dotfiles
      # by default and `.coverage` is one; without it the upload silently ships
      # nothing and the consumer falls back to a full duplicate suite run. The
      # name carries the uid so the two legs never overwrite each other.
      - name: Publish .coverage for the check-coverage consumer
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.uid }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      # bd-ib-xevgsx: since 704a96ded the consumer replays the producer's
      # canonical verdict only when .coverage-gates/per-file.{status,log} exist;
      # without them it prints "no canonical per-file verdict; running the
      # suite" and re-runs the whole suite. Ship the verdict beside .coverage.
      - name: Publish the canonical per-file verdict for the check-coverage consumer
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gates-${{ matrix.uid }}
          path: .coverage-gates/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  check-coverage:
    name: ${{ matrix.target }} (${{ matrix.uid }})
    if: needs.decide.outputs.run == 'true'
    needs: [decide, check-per-file-coverage]
    # bd-ib-uxv5al: the coverage pair routes through its OWN variable so it can
    # stay on k3s while CI_RUNNER_LABELS sends every other job to hosted runners
    # (a hosted runner ran this suite at 55+ min against a 17.5 min k3s median).
    # Unset, it falls through to CI_RUNNER_LABELS, so nothing moves.
    runs-on: ${{ fromJSON(inputs.runner_labels || vars.CI_COVERAGE_RUNNER_LABELS || vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.186.0
    env:
      # Lane-selected uv bounds from THIS job's routing (see the top-level env).
      UV_CONCURRENT_DOWNLOADS: ${{ contains(inputs.runner_labels || vars.CI_COVERAGE_RUNNER_LABELS || vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '50' || '4' }}
      UV_HTTP_TIMEOUT: ${{ contains(inputs.runner_labels || vars.CI_COVERAGE_RUNNER_LABELS || vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '30' || '60' }}
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        uid:
          - root
        target:
          - check-coverage
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # bd-ib-hik3mz: ONE step, not three. Every step of a k3s job pays
      # about 1 s of container-hook launch; same commands, same order, and the
      # step shell is -e, so the first failing command still fails the step.
      - name: Prepare workspace (git trust, mise trust + install, uv sync)
        run: |
          git config --global --add safe.directory '*'
          mise trust
          mise install
          uv sync --all-groups

      # Downloaded BEFORE the non-root prep below, so that step's
      # `chown -R 1000:1000 "$GITHUB_WORKSPACE"` covers the `.coverage` the
      # uid-1000 leg has to read AND delete (consume-once).
      - name: Download this uid's .coverage from the producer
        uses: actions/download-artifact@v4
        with:
          name: coverage-data-${{ matrix.uid }}

      # bd-ib-xevgsx: restore .coverage-gates/ so check-coverage reads the
      # producer's verdict instead of re-running the suite.
      - name: Download this uid's canonical per-file verdict from the producer
        uses: actions/download-artifact@v4
        with:
          name: coverage-gates-${{ matrix.uid }}
          path: .coverage-gates

      # bd-ib-jcrdzk: a GitHub-hosted container's HOME is /github/home, so mise
      # cannot find its global config under /root and the node shim resolves no
      # version; pyright then falls back to nodeenv, which crashes. Point mise at
      # the baked config and put its shims first, as ci.yml's legs already do.
      - name: Point mise at the baked global config (root)
        if: matrix.uid == 'root'
        run: |
          echo "MISE_GLOBAL_CONFIG_FILE=/root/.config/mise/config.toml" >> "$GITHUB_ENV"
          echo "/root/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: just ${{ matrix.target }} (root)
        if: matrix.uid == 'root'
        run: just ${{ matrix.target }}

  check-python-batch:
    name: check-python-batch (${{ matrix.uid }})
    needs: [decide]
    if: needs.decide.outputs.run == 'true'
    runs-on: ${{ fromJSON(inputs.runner_labels || vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.186.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        uid:
          - root
    steps:

      - name: Checkout
        uses: actions/checkout@v5

      # bd-ib-hik3mz: ONE step, not three. Every step of a k3s job pays
      # about 1 s of container-hook launch; same commands, same order, and the
      # step shell is -e, so the first failing command still fails the step.
      - name: Prepare workspace (git trust, mise trust + install, uv sync)
        run: |
          git config --global --add safe.directory '*'
          mise trust
          mise install
          uv sync --all-groups

      # bd-ib-jcrdzk: a GitHub-hosted container's HOME is /github/home, so mise
      # cannot find its global config under /root and the node shim resolves no
      # version; pyright then falls back to nodeenv, which crashes. Point mise at
      # the baked config and put its shims first, as ci.yml's legs already do.
      - name: Point mise at the baked global config (root)
        if: matrix.uid == 'root'
        run: |
          echo "MISE_GLOBAL_CONFIG_FILE=/root/.config/mise/config.toml" >> "$GITHUB_ENV"
          echo "/root/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Run the batched python checks (root)
        if: matrix.uid == 'root'
        run: |
          failed=""
          just check-all-declared || failed="$failed check-all-declared"
          just check-assert-never-exhaustiveness || failed="$failed check-assert-never-exhaustiveness"
          just check-check-mutation || failed="$failed check-check-mutation"
          just check-file-lloc || failed="$failed check-file-lloc"
          just check-global-writes || failed="$failed check-global-writes"
          just check-keyword-only-args || failed="$failed check-keyword-only-args"
          just check-main-guard || failed="$failed check-main-guard"
          just check-match-keyword-only || failed="$failed check-match-keyword-only"
          just check-newtype-domain-primitives || failed="$failed check-newtype-domain-primitives"
          just check-no-except-outside-io || failed="$failed check-no-except-outside-io"
          just check-no-inheritance || failed="$failed check-no-inheritance"
          just check-no-lloc-soft-warnings || failed="$failed check-no-lloc-soft-warnings"
          just check-no-raise-outside-io || failed="$failed check-no-raise-outside-io"
          just check-no-write-direct || failed="$failed check-no-write-direct"
          just check-pbt-coverage-pure-modules || failed="$failed check-pbt-coverage-pure-modules"
          just check-private-calls || failed="$failed check-private-calls"
          just check-public-api-result-typed || failed="$failed check-public-api-result-typed"
          just check-rop-pipeline-shape || failed="$failed check-rop-pipeline-shape"
          just check-self-hosted-uv-lane || failed="$failed check-self-hosted-uv-lane"
          just check-supervisor-discipline || failed="$failed check-supervisor-discipline"
          just check-tests-mirror-pairing || failed="$failed check-tests-mirror-pairing"
          just check-tests-no-subprocess-spawn || failed="$failed check-tests-no-subprocess-spawn"
          just check-wrapper-shape || failed="$failed check-wrapper-shape"
          if [ -n "$failed" ]; then
            echo "Failed targets:$failed"
            exit 1
          fi

  # The run's single verdict, which the breakage filer reads.
  root-uid-green:
    name: root-uid-green
    needs: [decide, check-python, check-per-file-coverage, check-coverage, check-python-batch]
    if: always() && needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: All root-uid checks passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
