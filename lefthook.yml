# lefthook.yml — livespec-orchestrator-beads-fabro git hook configuration.
#
# Generated from livespec/templates/impl-plugin/lefthook.yml.jinja
# at copier-copy time; re-sync via `copier update --vcs-ref=master` when livespec
# publishes a new release.
#
# Authority: livespec/SPECIFICATION/contracts.md
#   §"Pre-commit step ordering" (v219) — pre-commit runs four commands
#   in order (00-install-worktree-pack, 01-lint-autofix-staged,
#   02-commit-pairs-source-and-test, 03-check-pre-commit); commit-msg
#   runs no-commit-on-master then red-green-replay (v034 D3); pre-push
#   runs 00-install-worktree-pack, then the full aggregate, then the
#   always-run ledger-conformance check.
#
# Why `just install-worktree-pack` runs FIRST at pre-commit and pre-push:
# the worktree-discipline pack is gitignored-and-installed, so a worktree
# created by raw `git worktree add` (or one predating a
# livespec-dev-tooling pin bump) would otherwise reach the gate with the
# pack absent or stale and fail `worktree_pack_absent` only after the
# whole aggregate ran. The installer is idempotent, writes only ignored
# files, installs from the package this checkout resolves, and the
# byte-identity verifier still asserts the result.
#
# Authority: livespec/SPECIFICATION/non-functional-requirements.md
#   §"Toolchain pins" — `run:` fields MUST delegate to `just <target>`
#   and MUST NOT shell out to underlying tools directly (the spec's
#   lefthook-must-delegate-to-just rule, enforced by
#   dev-tooling/checks/no_direct_tool_invocation.py).
#
# Activation: `just bootstrap` installs the structural commit-refuse
# wrapper into .git/hooks/pre-commit, .git/hooks/pre-push, and
# .git/hooks/commit-msg via the livespec-dev-tooling installer module
# (`uv run python -m livespec_dev_tooling.install_commit_refuse_hooks`;
# the canonical body is the wheel-shipped CANONICAL_HOOK_BODY, not a
# per-repo vendored `.sh`). The wrapper refuses at a primary checkout
# (git-dir == git-common-dir, unless livespec.sandboxExempt=true) then
# invokes `mise exec -- lefthook run <hook-name> "$@"` so the gate fires
# regardless of shell config and commit-msg argv[1] (the commit-message
# file path) reaches the red-green-replay hook.

pre-commit:
  commands:
    00-install-worktree-pack:
      run: just install-worktree-pack
    01-lint-autofix-staged:
      run: just lint-autofix-staged
    02-commit-pairs-source-and-test:
      run: just check-commit-pairs-source-and-test
    03-check-pre-commit:
      run: just check-pre-commit

commit-msg:
  commands:
    00-no-commit-on-master:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" = "master" ]; then
          printf 'ERROR: direct commits to master are forbidden; create a feature branch first\n' >&2
          printf 'Hint: git checkout -b <branch-name>\n' >&2
          exit 1
        fi
    01-red-green-replay:
      run: just check-red-green-replay {1}

pre-push:
  commands:
    00-install-worktree-pack:
      run: just install-worktree-pack
    # `use_stdin: true` is load-bearing (work-item bd-ib-qy5wol.1; the rule is
    # SPECIFICATION/constraints.md §"Pre-push gate refinements", v151). git
    # writes one `<local ref> <local oid> <remote ref> <remote oid>` line per
    # ref update to the pre-push hook's standard input, and the gate reads it to
    # recognise a push whose every update is a DELETION — which publishes no
    # tree, so there is nothing for the aggregate to judge. lefthook forwards a
    # hook's standard input to a command ONLY when that command declares this
    # flag; without it the gate is handed nothing, every push reads as
    # no-input, and the skip can never fire — silently, because the gate still
    # runs and still passes.
    01-check-pre-push:
      run: just check-pre-push
      use_stdin: true
    # ALWAYS-RUN, standalone from `01-check-pre-push` so it is never subject to
    # check-pre-push's green-token / deletion-only skips: the beads tenant's state
    # is not tree-derived, so a tree-identical push can still carry a drifted
    # tenant. FAIL-SOFT — blocks only on POSITIVELY confirmed out-of-lifecycle
    # work-items; any creds/server/parse problem skips (exit 0). See the
    # `check-ledger-conformance-live` recipe header.
    02-ledger-conformance:
      run: just check-ledger-conformance-live
